name: Create Release

on:
  push:
    branches:
      - main

jobs:
  github-release:
    name: Create and release assets to GitHub
    runs-on: ubuntu-latest
    environment: release

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bump version
        uses: ./
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine new version
        id: determine-new-version
        # We get output of this action inside a VERSION file.
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: generate GitHub App token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: generate-token
        with:
          client-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          repositories: ${{ github.repository }}
          permission-contents: write

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.determine-new-version.outputs.version }}
          generate_release_notes: true
          target_commitish: ${{ github.sha }}
          token: ${{ steps.generate-token.outputs.token }}
